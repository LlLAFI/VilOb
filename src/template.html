<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Village Observer V0.34C1H</title><!-- VILOB_D0_BLOCK_000 --></head><body>
<!-- VILOB_D0_BLOCK_001 -->

<div class="shell"><header class="topbar"><div><button type="button" class="eyebrow version-badge" id="versionBadge" aria-haspopup="dialog" aria-controls="patchNotesModal" aria-label="버전 및 패치노트 열기">Village Observer · V0.33F</button><strong id="timeLabel">1년 1분기 1일</strong><span id="worldMood" class="muted small"></span></div><div class="sim-controls"><button id="playBtn" class="primary">▶</button><button class="speed active" data-speed="1">×1</button><button class="speed" data-speed="3">×3</button><button class="speed" data-speed="10">×10</button><button class="speed" data-speed="30">×30</button><button id="stepBtn">+1일</button></div></header>
<div id="runtimeStatus" class="runtime">초기화 중…</div>
<main>
<section id="view-map" class="main-view active"><div id="globalStats" class="stats"></div><div class="panel"><div class="section-head"><div><h2>세계 지도</h2><div class="muted small">굵은 선은 국경, 점선은 최근 교역소 간 교역로</div></div><div class="map-file-actions"><button id="newWorldBtn">새 세계</button><label class="file-btn">맵 파일<input id="mapImportInput" type="file" accept=".json,application/json"></label><span id="mapSourceStatus" class="tag"></span></div></div><div class="map-toolbar"><button id="zoomOutBtn">−</button><span id="zoomLabel" class="tag">전체</span><button id="zoomInBtn">＋</button><button id="centerVillageBtn">선택 마을</button></div><div class="canvas-wrap"><canvas id="worldCanvas" width="760" height="760"></canvas></div><div id="tileInspector" class="tile-inspector"></div></div></section>
<section id="view-village" class="main-view"><div class="village-switch"><div id="villageCards" class="village-strip"></div></div><div class="subtabs" id="villageSubtabs"><button data-sub="overview" class="active">개요</button><button data-sub="settlements">정착지</button><button data-sub="residents">주민</button><button data-sub="economy">경제</button><button data-sub="trade">교역</button></div><div id="villageContent" class="panel"></div></section>
<section id="view-tech" class="main-view"><div class="panel"><div class="section-head"><div><h2>기술</h2><div class="muted small">기술을 누르면 정확한 효과 수치를 볼 수 있습니다.</div></div></div><div id="researchSummary"></div><div id="techTree"></div></div></section>
<section id="view-codex" class="main-view"><div class="panel"><div class="section-head"><div><h2>밸런스 백과</h2><div class="muted small">현재 버전의 비용·생산·유지·물류·도로·기술 수치를 한곳에서 확인합니다.</div></div></div><div id="codexContent"></div></div></section>
<section id="view-stats" class="main-view"><div class="panel"><div class="section-head"><div><h2>통계</h2><div class="muted small">세계·국가·정착지의 장기 변화를 연간 기록으로 확인합니다.</div></div></div><div class="stats-controls"><select id="statsScope"><option value="world">세계</option><option value="nation" selected>국가</option><option value="settlement">정착지</option></select><select id="statsNation"></select><select id="statsSettlement"></select><select id="statsMetric"></select><select id="statsPeriod"><option value="0">전체 기간</option><option value="10">최근 10년</option><option value="25">최근 25년</option><option value="50">최근 50년</option></select></div><div id="statsNote" class="small muted" style="margin-bottom:8px"></div><div class="stats-chart-wrap"><canvas id="statsCanvas" width="900" height="350"></canvas></div></div></section><section id="view-world" class="main-view"><div class="panel"><h2>관찰자 개입</h2><div class="button-grid"><button id="foodBtn">🌾 중심지 식량 +50</button><button id="woodBtn">🪵 중심지 목재 +30</button><button id="goldBtn">🪙 Gold +25</button><button id="moraleBtn">✨ 사기 +8</button><button id="stormBtn" class="danger">⛈️ 폭풍</button></div></div><div class="panel"><div class="section-head"><div><h2>개발 로그</h2><div class="muted small">현재 상태와 메모 저장</div></div><span id="devLogCount" class="tag"></span></div><textarea id="devNote" rows="3" placeholder="밸런스 피드백 메모"></textarea><div class="button-grid"><button id="captureBtn">📌 기록</button><button id="exportLogJsonBtn">로그 JSON</button><button id="exportLogCsvBtn">스냅샷 CSV</button><button id="clearLogBtn">비우기</button></div><div id="devLogPreview"></div></div><div class="panel"><h2>세이브</h2><div class="button-grid"><button id="saveBtn">저장</button><button id="loadBtn">불러오기</button><button id="exportBtn">세이브 JSON</button><label class="file-btn">가져오기<input id="importInput" type="file" accept=".json"></label></div><div id="saveMessage" class="muted small"></div></div><div class="panel"><h2>세계 연대기</h2><div id="chronicle" class="chronicle"></div></div></section>
</main>
<nav class="bottom-nav"><button data-view="map" class="active">🗺️<span>지도</span></button><button data-view="village">🏛️<span>국가</span></button><button data-view="tech">🧠<span>기술</span></button><button data-view="codex">📚<span>백과</span></button><button data-view="stats">📊<span>통계</span></button><button data-view="world">🌐<span>세계</span></button></nav></div>
<div id="techModal" class="modal"><div class="modal-card"><button id="techModalClose" class="modal-close">✕</button><div id="techModalBody"></div></div></div>
